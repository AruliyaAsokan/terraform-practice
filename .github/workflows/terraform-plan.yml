name: Terraform Plan

on:
  push:
    branches: 
        - main
        - feat/terraform-plan-ci
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Plan - ${{ matrix.task }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - task: task1-ec2-web-server
            terraform_dir: task1-ec2-web-server

          - task: task2-s3-static-website
            terraform_dir: task2-s3-static-website

          - task: task4-iam-users
            terraform_dir: task4-iam-users
    env:
      AWS_REGION: ap-south-1
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialise
        working-directory: ${{ matrix.terraform_dir }}
        run: terraform init

      - name: Check formatting
        working-directory: ${{ matrix.terraform_dir }}
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: ${{ matrix.terraform_dir }}
        run: terraform validate -no-color

      - name: Plan
        working-directory: ${{ matrix.terraform_dir }}
        run: terraform plan -no-color -out=tfplan

      - name: Convert plan to readable text
        working-directory: ${{ matrix.terraform_dir }}
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
                ${{ matrix.terraform_dir }}/tfplan
                ${{ matrix.terraform_dir }}/plan.txt
          retention-days: 5
